[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saturncube"
dynamic = ["version"]
description = "One fit/predict/evaluate interface across many neural-network families, learning rules and training methods, built on PyTorch."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "torch>=2.0"]
keywords = ["machine learning", "deep learning", "pytorch", "neural networks", "spiking neural networks",
            "reinforcement learning", "continual learning", "meta-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "ChristopherDarien-3" }]

[project.optional-dependencies]
data = ["pandas>=1.5"]
bench = ["scikit-learn>=1.0"]
dev = ["pytest>=7", "scipy", "pandas>=1.5", "scikit-learn>=1.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/ChristopherDarien-3/SaturnCube"
Repository = "https://github.com/ChristopherDarien-3/SaturnCube"
Issues = "https://github.com/ChristopherDarien-3/SaturnCube/issues"
Changelog = "https://github.com/ChristopherDarien-3/SaturnCube/blob/HEAD/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "saturncube.__version__" }

[tool.setuptools.packages.find]
include = ["saturncube*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer-running tests (deselect with -m 'not slow')"]
