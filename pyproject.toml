[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saturncube"
dynamic = ["version"]
description = "One fit/predict/evaluate interface across many neural-network families, learning rules and training methods, built on PyTorch."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "torch>=2.0"]
keywords = ["machine learning", "deep learning", "pytorch", "neural networks", "spiking neural networks",
            "reinforcement learning", "continual learning", "meta-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# TODO before the first release -------------------------------------------------------------
# 1. Put your LICENSE file next to this file, then uncomment these two lines and use your SPDX id
#    (for example "MIT" or "Apache-2.0"):
# license = "MIT"
# license-files = ["LICENSE*"]
# 2. Add your name / contact and project links:
# authors = [{ name = "Your Name", email = "you@example.com" }]
# [project.urls]
# Homepage = "https://github.com/<you>/saturncube"
# Issues = "https://github.com/<you>/saturncube/issues"
# (If you uncomment [project.urls], keep it after the dependency tables below.)
# --------------------------------------------------------------------------------------------

[project.optional-dependencies]
dev = ["pytest>=7", "scipy", "build", "twine"]

[tool.setuptools.dynamic]
version = { attr = "saturncube.__version__" }

[tool.setuptools.packages.find]
include = ["saturncube*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer-running tests (deselect with -m 'not slow')"]
