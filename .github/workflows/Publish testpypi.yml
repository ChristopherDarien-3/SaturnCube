name: Publish to TestPyPI

# Dry run: start it by hand (Actions tab -> "Publish to TestPyPI" -> Run workflow). A GitHub release does not trigger it.
# TestPyPI trusted publisher settings (on test.pypi.org, a separate site and account from pypi.org):
#   workflow publish-testpypi.yml, environment testpypi

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: testpypi

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true     # re-running after a success does not fail on the version already being there
